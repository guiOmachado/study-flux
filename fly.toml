# Fly.io — troque `app` por um nome único (ex.: study-flux-sua-faculdade).
#
#   fly launch --no-deploy --copy-config
#   fly volumes create studyflux_data --size 1 --region gru
#   fly secrets set APP_SECRET=$(openssl rand -hex 32)
#   fly deploy
#
# Detalhes em docs/DEPLOY.md.

app = "study-flux-troque-este-nome"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  COOKIE_SECURE = "auto"
  TRUST_PROXY = "1"
  SEED_DEMO = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# SQLite precisa de disco persistente e de UMA máquina só.
[mounts]
  source = "studyflux_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
